[project]
name = "st4patcher"
version = "0.1.0"
description = "Reverse-engineering tooling and repeatable patcher for the Sublime Text 4 (Linux x64) startup license window"
readme = "README.md"
requires-python = ">=3.12"
# Unlike the sibling plugin repo (zero-dep, runs inside Sublime's embedded
# Python host), this is a *tooling* repo: it does real ELF/disassembly work and
# therefore declares actual compiled dependencies.
dependencies = [
    "capstone>=5.0",
    "pyelftools>=0.31",
    # Parses the official APT `Packages` indices to derive the set of official
    # dev/stable build numbers (pure-python: attrs + chardet, no compiled deps).
    "debian-inspector>=31",
]

[project.scripts]
# Console entry point: `uv run st4patch --src ... --locate`
st4patch = "st4patcher.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["st4patcher"]

# --------------------------------------------------------------------------- #
#  Ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long: handled by the formatter / line-length above
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use `assert` and longer, descriptive names freely.
"tests/**" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["st4patcher"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
#  Pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
